# Never idle-suspend the built-in analog sink/source.
#
# WirePlumber closes an idle node after 5 s. Closing the PCM lets the ALC294
# codec and the TI TAS2781 speaker amps drop power, and re-arming them on the
# next sound is where this machine misbehaves. Paired with
# /etc/modprobe.d/90-snd-hda-no-powersave.conf, which stops the kernel side
# from autosuspending the codec.
#
# Scoped to the built-in card on purpose: HDMI and Bluetooth sinks still
# suspend normally, so the dGPU audio function can still reach D3.
#
# 0 = never suspend. Delete this file and `omarchy restart shell`-style restart
# of wireplumber (systemctl --user restart wireplumber) to revert.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3.analog-stereo" }
      { node.name = "alsa_input.pci-0000_00_1f.3.analog-stereo" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
