# Keep the HD-audio path powered; do not let it idle down.
#
# Default is power_save=10 (kernel CONFIG_SND_HDA_POWER_SAVE_DEFAULT), and this
# machine was running power_save=1 -- the codec dropped to D3 after one second
# of silence. On the ROG Strix G16 (ALC294 + TI TAS2781 smart amps) that
# repeatedly cycles power to the amps, which are already fragile across PM
# transitions: see /etc/tmpfiles.d/zz-s2idle.conf for the S3 resume failure
# where they stop acking on i2c entirely.
#
#   power_save=0             never autosuspend the codec
#   power_save_controller=N  never runtime-suspend the HDA controller with it
#
# Costs idle battery. Revert by deleting this file and rebooting, or at runtime:
#   echo 10 > /sys/module/snd_hda_intel/parameters/power_save
#   echo Y  > /sys/module/snd_hda_intel/parameters/power_save_controller
options snd_hda_intel power_save=0 power_save_controller=N
