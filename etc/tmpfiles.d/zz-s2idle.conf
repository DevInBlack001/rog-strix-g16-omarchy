# Suspend to s2idle, not S3/deep.
#
# Under deep, resume leaves the TI TAS2781 speaker amps unpowered: they stop
# acking on i2c-6 entirely (every transfer returns -121 EREMOTEIO) and the
# speakers are silent until a cold boot. ASUS designed this platform around
# s2idle.
#
# Verified 2026-08-23 that this is NOT merely a resume-ordering problem and
# cannot be repaired from userspace after the fact:
#   - Re-probing the HDA controller (0000:00:1f.3) after resume rebinds
#     tas2781-hda cleanly but the amps still return -121: the bus is up, the
#     amps are not answering.
#   - `i2cdetect -y -r 6` post-resume finds nothing but the driver-claimed
#     0x39, i.e. the amps are unpowered or held in reset by the platform.
#   - Re-binding the LPSS I2C controller itself (0000:00:19.0, intel-lpss) to
#     force a full re-init HANGS in the kernel in uninterruptible sleep, and
#     leaves both the controller and the HDA card unbound until reboot.
#     Do not try this again.
#
# Costs more battery while suspended than deep does. That is the price of
# working speakers on this machine.
w /sys/power/mem_sleep - - - - s2idle
