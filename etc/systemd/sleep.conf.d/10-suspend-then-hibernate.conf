# Suspend to s2idle first, then hibernate. Added 2026-08-23.
#
# Why: this platform (Raptor Lake-HX) implements no S0ix. /sys/power/suspend_stats/
# total_hw_sleep never leaves 0 and both LPIT residency counters read a constant 0,
# so s2idle only freezes the OS -- no rails are cut and the package keeps drawing.
# Measured over a 20 min instrumented s2idle on battery: ~2.65 W, fan stopped,
# package cooling 50C -> 47C. That is the machine sitting warm in a bag, and it is
# the platform floor, not a misconfiguration -- there is no tuning that lowers it.
# Hibernating after the delay takes the draw and the heat to zero.
#
# SuspendState=freeze pins the suspend half to s2idle by writing "freeze" directly
# to /sys/power/state, so it cannot fall through to deep/S3 no matter what
# /sys/power/mem_sleep holds. This is load-bearing: under S3 the TAS2781 speaker
# amps resume unpowered and only a cold boot revives them. See
# /etc/tmpfiles.d/zz-s2idle.conf for the full history.
#
# HibernateOnACPower=no leaves plugged-in suspends in s2idle for fast resume; the
# warmth and drain only matter on battery.

[Sleep]
SuspendState=freeze
HibernateDelaySec=30min
HibernateOnACPower=no
