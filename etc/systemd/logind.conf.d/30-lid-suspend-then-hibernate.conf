# Closing the lid should end in hibernation rather than an open-ended warm
# s2idle. Rationale and measurements in
# /etc/systemd/sleep.conf.d/10-suspend-then-hibernate.conf.
#
# Both lid cases use suspend-then-hibernate; HibernateOnACPower=no in sleep.conf.d
# is what keeps an AC-powered lid close in plain s2idle, so unplugging while
# already suspended still ends in hibernation.

[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend-then-hibernate
